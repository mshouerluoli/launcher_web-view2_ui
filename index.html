<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>launcher</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body oncontextmenu="return false;" onkeydown="return (event.keyCode !== 123);">

    <div class="top-bar" id="标题栏">
        <div class="窗口控制按钮组" id="窗口控制按钮组">
<button class="窗口按钮 设置" id="设置按钮" title="设置">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
    </svg>
</button>
            <button class="窗口按钮 最小化" id="最小化按钮" title="最小化">
                <i class="ri-subtract-line"></i>
            </button>
            <button class="窗口按钮 最大化" id="最大化按钮" title="最大化">
                <i class="ri-checkbox-multiple-blank-line"></i>
            </button>
            <button class="窗口按钮 关闭" id="关闭按钮" title="关闭">
                <i class="ri-close-line"></i>
            </button>
        </div>
    </div>

    <div class="genshin-container">
        <div class="info-tags" id="info-tags">
            <div class="info-tag info-tag-tag"><span class="tag-label">版本:</span><span class="tag-value" id="tag-tag"></span></div>
            <div class="info-tag info-tag-body"><span class="tag-label">公告:</span><span class="tag-value" id="tag-body"></span></div>
            <div class="info-tag info-tag-date"><span class="tag-label">更新日期:</span><span class="tag-value" id="tag-created"></span></div>
        </div>

        <div class="userinfo-panel" id="userinfo-panel">
            <div class="userinfo-header">
                <div class="userinfo-avatar">
                    <i class="ri-user-3-fill"></i>
                </div>
                <div class="userinfo-title">
                    <div class="userinfo-name" id="userinfo-user">未登录</div>
                    <div class="userinfo-group" id="userinfo-group"></div>
                </div>
            </div>
            <div class="userinfo-body">
                <div class="userinfo-item">
                    <!--<i class="ri-shield-keyhole-line"></i>-->
                    <span class="userinfo-label">心跳ID</span>
                    <span class="userinfo-value" id="userinfo-tokenid">-</span>
                </div>
                <div class="userinfo-item">
                    <!--<i class="ri-computer-line"></i>-->
                    <span class="userinfo-label">客户端ID</span>
                    <span class="userinfo-value" id="userinfo-clientid">-</span>
                </div>
                <div class="userinfo-item">
                   <!-- <i class="ri-time-line"></i> -->
                    <span class="userinfo-label">过期时间</span>
                    <span class="userinfo-value" id="userinfo-endtime">-</span>
                </div>
                <div class="userinfo-item">
                   <!-- <i class="ri-coin-line"></i> -->
                    <span class="userinfo-label">点数</span>
                    <span class="userinfo-value" id="userinfo-point">-</span>
                </div>
                <div class="userinfo-item">
                   <!-- <i class="ri-star-line"></i> -->
                    <span class="userinfo-label">积分</span>
                    <span class="userinfo-value" id="userinfo-integral">-</span>
                </div>
                <div class="userinfo-item">
                    <!--<i class="ri-mac-line"></i> -->
                    <span class="userinfo-label">设备码</span>
                    <span class="userinfo-value" id="userinfo-mac">-</span>
                </div>
                <div class="userinfo-item">
                    <!--<i class="ri-global-line"></i> -->
                    <span class="userinfo-label">IP地址</span>
                    <span class="userinfo-value" id="userinfo-ip">-</span>
                </div>
                <div class="userinfo-item">
                    <!--<i class="ri-window-line"></i> -->
                    <span class="userinfo-label">多开</span>
                    <span class="userinfo-value" id="userinfo-dk">-</span>
                </div>
                <div class="userinfo-item">
                    <!--<i class="ri-mail-line"></i> -->
                    <span class="userinfo-label">邮箱</span>
                    <span class="userinfo-value" id="userinfo-email">-</span>
                </div>
                <div class="userinfo-item">
                    <!--<i class="ri-qq-line"></i> -->
                    <span class="userinfo-label">QQ</span>
                    <span class="userinfo-value" id="userinfo-userqq">-</span>
                </div>
                <div class="userinfo-item">
                    <!--<i class="ri-calendar-add-line"></i> -->
                    <span class="userinfo-label">注册时间</span>
                    <span class="userinfo-value" id="userinfo-addtime">-</span>
                </div>
                <div class="userinfo-item">
                    <!--<i class="ri-login-circle-line"></i> -->
                    <span class="userinfo-label">登录时间</span>
                    <span class="userinfo-value" id="userinfo-logintime">-</span>
                </div>
            </div>
        </div>

        <div class="bottom-section">
<button class="start-game-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5,3 19,12 5,21"/>
    </svg>
    <span>开始游戏</span>
</button>
            <div class="menu-btn">
                <div class="menu-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bundle.js"></script>
</body>
</html>
